name: build
# Windows-only compilation of the approved settings UI.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

concurrency:
  group: bdfr-persian-calendar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # [pc-android-only] builds Core, Windows desktop and Android.\n  # [windows-debug-only] builds a Windows Debug portable ZIP only.
  core:
    if: ${{ !contains(github.event.head_commit.message, '[no-build]') && (github.event_name != 'push' || (!contains(github.event.head_commit.message, '[theme-studio-only]') && !contains(github.event.head_commit.message, '[windows-only]')) && !contains(github.event.head_commit.message, '[windows-debug-only]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run calendar and time.ir parser smoke checks
        run: dotnet run --project tools/BDFR.PersianCalendar.Smoke/BDFR.PersianCalendar.Smoke.csproj

      - name: Build infrastructure
        run: dotnet build src/BDFR.PersianCalendar.Infrastructure/BDFR.PersianCalendar.Infrastructure.csproj -c Release

      - name: Build Zurvan Desk account API
        run: dotnet build server/Zurvan.Desk.Api/Zurvan.Desk.Api.csproj -c Release


  theme-studio:
    if: ${{ !contains(github.event.head_commit.message, '[no-build]') && (github.event_name != 'push' || (!contains(github.event.head_commit.message, '[pc-android-only]') && !contains(github.event.head_commit.message, '[windows-only]')) && !contains(github.event.head_commit.message, '[windows-debug-only]')) }}
    name: Build Windows Theme Studio
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish Zurvan Theme Studio .NET 9
        shell: pwsh
        run: |
          dotnet publish tools/Zurvan.ThemeStudio/Zurvan.ThemeStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/Zurvan-ThemeStudio
          Compress-Archive -Path artifacts/Zurvan-ThemeStudio/* -DestinationPath artifacts/Zurvan-ThemeStudio-win-x64.zip -Force
      - name: Smoke test Theme Studio startup
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "artifacts/Zurvan-ThemeStudio/Zurvan.ThemeStudio.exe"
          if (-not (Test-Path $exe)) { throw "Theme Studio EXE missing: $exe" }
          $process = Start-Process -FilePath $exe -PassThru -ErrorAction Stop
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw "Theme Studio exited during startup with code $($process.ExitCode)."
            }
            Write-Host "Theme Studio remained running after startup."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Regression test Zara Pastel selection
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "artifacts/Zurvan-ThemeStudio/Zurvan.ThemeStudio.exe"
          $env:ZURVAN_STUDIO_PRESET_SELFTEST = "1"
          try {
            $testProcess = Start-Process -FilePath $exe -Wait -PassThru -ErrorAction Stop
            if ($testProcess.ExitCode -ne 0) {
              $log = Join-Path $env:TEMP "zurvan-theme-studio-preset-selftest.log"
              if (Test-Path $log) { Get-Content $log | Write-Host }
              throw "Zara Pastel preset regression failed, exit code $($testProcess.ExitCode)."
            }
            Write-Host "Zara Pastel and all seven weekday swatches validated successfully."
          }
          finally {
            Remove-Item Env:ZURVAN_STUDIO_PRESET_SELFTEST -ErrorAction SilentlyContinue
          }
      - name: Upload Theme Studio
        uses: actions/upload-artifact@v4
        with:
          name: Zurvan-ThemeStudio-win-x64
          path: artifacts/Zurvan-ThemeStudio-win-x64.zip
          retention-days: 30
          if-no-files-found: error

  android:
    if: ${{ !contains(github.event.head_commit.message, '[no-build]') && (github.event_name != 'push' || (!contains(github.event.head_commit.message, '[theme-studio-only]') && !contains(github.event.head_commit.message, '[windows-only]')) && !contains(github.event.head_commit.message, '[windows-debug-only]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android debug app
        env:
          ZURVAN_PUBLIC_KEY_B64: ${{ vars.ZURVAN_LICENSE_PUBLIC_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ZURVAN_PUBLIC_KEY_B64:-}" ]]; then
            echo "::error::ZURVAN_LICENSE_PUBLIC_KEY_B64 repository variable is required for activation-enabled builds."
            exit 1
          fi
          gradle -p mobile/android :app:assembleDebug --stacktrace "-PZURVAN_LICENSE_PUBLIC_KEY_B64=${ZURVAN_PUBLIC_KEY_B64}"
          unzip -l mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'resources.arsc|AndroidManifest.xml'

      - name: Upload Android debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Zurvan-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    if: ${{ !contains(github.event.head_commit.message, '[no-build]') && (github.event_name != 'push' || (!contains(github.event.head_commit.message, '[pc-android-only]') && !contains(github.event.head_commit.message, '[theme-studio-only]') && !contains(github.event.head_commit.message, '[windows-only]')) && !contains(github.event.head_commit.message, '[windows-debug-only]')) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iOS Xcode project
        working-directory: mobile/ios
        run: xcodegen generate

      - name: Build iOS simulator app
        run: |
          xcodebuild             -project mobile/ios/ZurvanIOS.xcodeproj             -scheme ZurvanIOS             -sdk iphonesimulator             -configuration Debug             CODE_SIGNING_ALLOWED=NO             -derivedDataPath mobile/ios/DerivedData             build

      - name: Package iOS simulator test app
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          app="mobile/ios/DerivedData/Build/Products/Debug-iphonesimulator/Zurvan.app"
          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" Zurvan-iOS-simulator.zip

      - name: Upload iOS simulator artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Zurvan-iOS-simulator
          path: Zurvan-iOS-simulator.zip
          if-no-files-found: error
          retention-days: 14

  mobile-release:
    name: Publish mobile test downloads
    if: ${{ !contains(github.event.head_commit.message, '[no-build]') && (github.event_name == 'push' && !contains(github.event.head_commit.message, '[theme-studio-only]') && !contains(github.event.head_commit.message, '[pc-android-only]') && !contains(github.event.head_commit.message, '[windows-only]') && !contains(github.event.head_commit.message, '[windows-debug-only]')) }}
    needs: [android, ios, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android debug APK
        uses: actions/download-artifact@v4
        with:
          name: Zurvan-Android-debug
          path: mobile-release/android

      - name: Download iOS simulator archive
        uses: actions/download-artifact@v4
        with:
          name: Zurvan-iOS-simulator
          path: mobile-release/ios

      - name: Label Android build and publish mobile assets to test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp mobile-release/android/app-debug.apk mobile-release/Zurvan-Android-debug.apk
          cp mobile-release/ios/Zurvan-iOS-simulator.zip mobile-release/Zurvan-iOS-simulator.zip
          cd mobile-release
          sha256sum Zurvan-Android-debug.apk Zurvan-iOS-simulator.zip > SHA256SUMS-mobile.txt
          tag="test-${{ github.run_number }}"
          gh release upload "$tag" Zurvan-Android-debug.apk Zurvan-iOS-simulator.zip SHA256SUMS-mobile.txt --clobber --repo "${{ github.repository }}"
          gh release edit "$tag" --repo "${{ github.repository }}" --notes "Automated test build from main (${{ github.sha }}).
          
          Windows: portable ZIP and installer EXE.
          Android: Zurvan-Android-debug.apk (debug/test build; enable sideloading on your test device).
          iOS: Zurvan-iOS-simulator.zip (Xcode simulator only; NOT installable on a physical iPhone).
          Physical iOS installation requires Apple code signing, an IPA distribution workflow, or TestFlight.
          All downloads are test builds, not production releases."

  windows:
    if: ${{ !contains(github.event.head_commit.message, '[no-build]') && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[theme-studio-only]') && !contains(github.event.head_commit.message, '[windows-debug-only]')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize optional seasonal carousel assets
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $payloadDir = Join-Path $env:GITHUB_WORKSPACE "tools\season-assets"
          $required = @("spring.b64", "summer.b64", "autumn.b64", "winter.b64")
          $allReady = Test-Path $payloadDir

          if ($allReady) {
            foreach ($name in $required) {
              if (-not (Test-Path (Join-Path $payloadDir $name))) {
                $allReady = $false
              }
            }
          }

          if (-not $allReady) {
            Write-Host "Season asset payload set is incomplete; keeping repository assets as-is."
            exit 0
          }

          $target = Join-Path $env:GITHUB_WORKSPACE "picture\theme\season backgrounds"
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          # Remove only old aspect-ratio variants. Keep numbered carousel
          # files such as Spring_1.jpg / Spring_2.webp.
          Get-ChildItem $target -File |
            Where-Object { $_.Name -match '^(Spring|Summer|Autumn|Winter)[_-]\d{1,3}x\d{1,3}\.(svg|png|jpg|jpeg|webp)$' } |
            Remove-Item -Force

          foreach ($season in @("spring", "summer", "autumn", "winter")) {
            $payload = Join-Path $payloadDir "$season.b64"
            $zip = Join-Path $env:RUNNER_TEMP "$season.zip"

            [IO.File]::WriteAllBytes(
              $zip,
              [Convert]::FromBase64String((Get-Content $payload -Raw).Trim())
            )

            Expand-Archive -Path $zip -DestinationPath $target -Force
          }

          # Older optional payload bundles may still carry aspect-ratio files.
          Get-ChildItem $target -File |
            Where-Object { $_.Name -match '^(Spring|Summer|Autumn|Winter)[_-]\d{1,3}x\d{1,3}\.(svg|png|jpg|jpeg|webp)$' } |
            Remove-Item -Force

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository zodiac artwork without modifying source files
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "picture/zodiac/png"
          if (-not (Test-Path $source -PathType Container)) { throw "Repository zodiac artwork folder is missing." }
          $files = @(Get-ChildItem $source -File)
          if ($files.Count -ne 143) { throw "Expected the approved 143 zodiac assets; found $($files.Count). Restore the complete approved asset set before building." }
          $png = @($files | Where-Object { $_.Extension -ieq ".png" }).Count
          $svg = @($files | Where-Object { $_.Extension -ieq ".svg" }).Count
          $ico = @($files | Where-Object { $_.Extension -ieq ".ico" }).Count
          if ($png -eq 0 -or $svg -eq 0 -or $ico -eq 0) { throw "Zodiac asset set must include PNG, SVG and ICO files." }
          Write-Host "Validated $($files.Count) approved zodiac assets ($png PNG, $svg SVG, $ico ICO). No generation or overwrite performed."

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate Zurvan Windows application icon
        shell: pwsh
        run: ./tools/GenerateZurvanIcon.ps1

      - name: Build WinUI desktop app
        env:
          ZURVAN_PUBLIC_KEY_B64: ${{ vars.ZURVAN_LICENSE_PUBLIC_KEY_B64 }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ZURVAN_PUBLIC_KEY_B64)) { throw "ZURVAN_LICENSE_PUBLIC_KEY_B64 repository variable is required for Windows license activation." }
          dotnet build src/BDFR.PersianCalendar.Desktop/BDFR.PersianCalendar.Desktop.csproj -c Release -p:Platform=x64 -p:AnahitaGitCommit="${{ github.sha }}" -p:AnahitaBuildNumber="${{ github.run_number }}" -p:ZurvanLicensePublicKeyB64="$env:ZURVAN_PUBLIC_KEY_B64"

      - name: Publish Windows x64 test build
        env:
          ZURVAN_PUBLIC_KEY_B64: ${{ vars.ZURVAN_LICENSE_PUBLIC_KEY_B64 }}
        shell: pwsh
        run: |
          dotnet publish src/BDFR.PersianCalendar.Desktop/BDFR.PersianCalendar.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=false `
            -p:AnahitaGitCommit="${{ github.sha }}" `
            -p:AnahitaBuildNumber="${{ github.run_number }}" `
            -p:ZurvanLicensePublicKeyB64="$env:ZURVAN_PUBLIC_KEY_B64" `
            -o artifacts/Zurvan-win-x64

      - name: Refresh packaged Zurvan clock face from repository and verify SHA256
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "picture/clock/zurvan-clock-face.svg"
          $target = Join-Path $env:GITHUB_WORKSPACE "artifacts/Zurvan-win-x64/picture/clock/zurvan-clock-face.svg"
          if (-not (Test-Path $source -PathType Leaf)) { throw "Clock SVG is missing from repository" }
          New-Item -ItemType Directory -Path (Split-Path $target -Parent) -Force | Out-Null
          if (Test-Path $target) { Remove-Item $target -Force }
          Copy-Item $source $target -Force
          $sourceHash = (Get-FileHash $source -Algorithm SHA256).Hash
          $targetHash = (Get-FileHash $target -Algorithm SHA256).Hash
          if ($sourceHash -ne $targetHash) { throw "Clock SVG in publish output differs from repository" }
          Write-Host "Clock SVG refreshed and verified SHA256: $targetHash"

      - name: Replace packaged zodiac PNG directory from repository
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "picture/zodiac/png"
          $target = Join-Path $env:GITHUB_WORKSPACE "artifacts/Zurvan-win-x64/picture/zodiac/png"
          if (-not (Test-Path $source -PathType Container)) { throw "Repository zodiac PNG source folder is missing: $source" }
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -Path (Join-Path $source "*") -Destination $target -Recurse -Force
          $sourceFiles = @(Get-ChildItem $source -File -Recurse)
          $targetFiles = @(Get-ChildItem $target -File -Recurse)
          if ($sourceFiles.Count -eq 0) { throw "Repository zodiac PNG folder is empty." }
          if ($sourceFiles.Count -ne $targetFiles.Count) { throw "Zodiac asset copy count mismatch. Source=$($sourceFiles.Count), target=$($targetFiles.Count)" }
          foreach ($file in $sourceFiles) {
            $relative = $file.FullName.Substring($source.Length).TrimStart([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar)
            $copied = Join-Path $target $relative
            if (-not (Test-Path $copied -PathType Leaf)) { throw "Missing packaged zodiac asset: $relative" }
            $sourceHash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
            $targetHash = (Get-FileHash $copied -Algorithm SHA256).Hash
            if ($sourceHash -ne $targetHash) { throw "Zodiac asset hash mismatch: $relative" }
          }
          Write-Host "Replaced packaged zodiac PNG folder with $($sourceFiles.Count) exact repository files; SHA256 verified."

      - name: Package portable test ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/Zurvan-win-x64/* `
            -DestinationPath artifacts/Zurvan-win-x64.zip `
            -Force

          (Get-FileHash artifacts/Zurvan-win-x64.zip -Algorithm SHA256).Hash |
            Out-File artifacts/Zurvan-win-x64.zip.sha256 -Encoding ascii

      - name: Install Inno Setup
        if: github.event_name == 'push'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMySourceDir="${{ github.workspace }}\artifacts\Zurvan-win-x64" `
            /DMyOutputDir="${{ github.workspace }}\artifacts" `
            installer\BDFR_PersianCalendar.iss

          (Get-FileHash artifacts/Zurvan-Setup-x64.exe -Algorithm SHA256).Hash |
            Out-File artifacts/Zurvan-Setup-x64.exe.sha256 -Encoding ascii

      - name: Upload portable test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zurvan-win-x64
          path: |
            artifacts/Zurvan-win-x64.zip
            artifacts/Zurvan-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Zurvan-Setup-x64
          path: |
            artifacts/Zurvan-Setup-x64.exe
            artifacts/Zurvan-Setup-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub test pre-release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "test-${{ github.run_number }}"
          $title = "Zurvan Test Build #${{ github.run_number }}"
          $releaseTarget = (git rev-parse HEAD).Trim()
          $notes = "Automated Zurvan Windows x64 test build from main. Commit: $releaseTarget. Includes portable ZIP, installer EXE and SHA256 checksums."

          gh release create $tag `
            artifacts/Zurvan-win-x64.zip `
            artifacts/Zurvan-win-x64.zip.sha256 `
            artifacts/Zurvan-Setup-x64.exe `
            artifacts/Zurvan-Setup-x64.exe.sha256 `
            --repo "${{ github.repository }}" `
            --target $releaseTarget `
            --title $title `
            --notes $notes `
            --prerelease

  windows-debug:
    name: Windows x64 Debug ZIP (Zodiac diagnostics)
    if: ${{ !contains(github.event.head_commit.message, '[no-build]') && (github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-debug-only]')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate Zurvan application icon
        shell: pwsh
        run: ./tools/GenerateZurvanIcon.ps1
      - name: Validate bundled zodiac and desk artwork
        shell: pwsh
        run: |
          $zodiacAssets = @(Get-ChildItem "picture/zodiac/png" -File)
          if ($zodiacAssets.Count -ne 143) { throw "Expected 143 approved zodiac assets before Debug packaging; found $($zodiacAssets.Count)." }
          $catalog = "picture/zodiac/catalog.json"
          $cloud = "picture/desk/welcome.svg"
          if (-not (Test-Path $catalog)) { throw "Missing zodiac catalog" }
          if (-not (Test-Path $cloud)) { throw "Missing Desk cloud illustration" }
          $data = Get-Content $catalog -Raw | ConvertFrom-Json
          if ($data.signs.Count -ne 12 -or $data.styles.Count -ne 9) { throw "Zodiac catalog must contain 12 signs and 9 themes" }
      - name: Publish Windows x64 Debug build
        shell: pwsh
        env:
          ZURVAN_PUBLIC_KEY_B64: ${{ vars.ZURVAN_LICENSE_PUBLIC_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ZURVAN_PUBLIC_KEY_B64)) { throw "ZURVAN_LICENSE_PUBLIC_KEY_B64 repository variable required" }
          dotnet publish src/BDFR.PersianCalendar.Desktop/BDFR.PersianCalendar.Desktop.csproj `
            -c Debug `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=false `
            -p:AnahitaGitCommit="${{ github.sha }}" `
            -p:AnahitaBuildNumber="${{ github.run_number }}" `
            -p:ZurvanLicensePublicKeyB64="$env:ZURVAN_PUBLIC_KEY_B64" `
            -o artifacts/Zurvan-win-x64-Debug
          $output = "artifacts/Zurvan-win-x64-Debug"
          $source = Join-Path $env:GITHUB_WORKSPACE "picture/zodiac/png"
          $target = Join-Path $output "picture/zodiac/png"
          if (-not (Test-Path $source -PathType Container)) { throw "Repository zodiac PNG source folder is missing: $source" }
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -Path (Join-Path $source "*") -Destination $target -Recurse -Force
          $sourceFiles = @(Get-ChildItem $source -File -Recurse)
          $targetFiles = @(Get-ChildItem $target -File -Recurse)
          if ($sourceFiles.Count -eq 0 -or $sourceFiles.Count -ne $targetFiles.Count) { throw "Debug zodiac asset copy count mismatch. Source=$($sourceFiles.Count), target=$($targetFiles.Count)" }
          foreach ($file in $sourceFiles) {
            $relative = $file.FullName.Substring($source.Length).TrimStart([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar)
            $copied = Join-Path $target $relative
            if (-not (Test-Path $copied -PathType Leaf)) { throw "Missing Debug zodiac asset: $relative" }
            if ((Get-FileHash $file.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $copied -Algorithm SHA256).Hash) { throw "Debug zodiac asset hash mismatch: $relative" }
          }
          Write-Host "Debug output zodiac folder replaced with $($sourceFiles.Count) repository files and SHA256 verified."
          $catalog = Join-Path $output "picture/zodiac/catalog.json"
          $cloud = Join-Path $output "picture/desk/welcome.svg"
          if (-not (Test-Path $catalog)) { throw "Zodiac artwork missing from Debug publish output: $catalog" }
          if (-not (Test-Path $cloud)) { throw "Zurvan Desk cloud missing from Debug publish output: $cloud" }
          $data = Get-Content $catalog -Raw | ConvertFrom-Json
          if ($data.signs.Count -ne 12 -or $data.styles.Count -ne 9) { throw "Published zodiac catalog invalid" }
          Write-Host "Verified 12 signs, 9 themes and Desk cloud illustration in Windows Debug output."
      - name: Package Debug ZIP only
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/Zurvan-win-x64-Debug/* -DestinationPath artifacts/Zurvan-win-x64-Debug.zip -Force
          (Get-FileHash artifacts/Zurvan-win-x64-Debug.zip -Algorithm SHA256).Hash | Out-File artifacts/Zurvan-win-x64-Debug.zip.sha256 -Encoding ascii
      - name: Upload Debug ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Zurvan-Windows-x64-Debug
          path: |
            artifacts/Zurvan-win-x64-Debug.zip
            artifacts/Zurvan-win-x64-Debug.zip.sha256
          retention-days: 14
          if-no-files-found: error
