name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

concurrency:
  group: bdfr-persian-calendar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run calendar and time.ir parser smoke checks
        run: dotnet run --project tools/BDFR.PersianCalendar.Smoke/BDFR.PersianCalendar.Smoke.csproj

      - name: Build infrastructure
        run: dotnet build src/BDFR.PersianCalendar.Infrastructure/BDFR.PersianCalendar.Infrastructure.csproj -c Release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize optional seasonal background assets
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $payloadDir = Join-Path $env:GITHUB_WORKSPACE "tools\season-assets"
          $required = @("spring.b64", "summer.b64", "autumn.b64", "winter.b64")
          $allReady = Test-Path $payloadDir

          if ($allReady) {
            foreach ($name in $required) {
              if (-not (Test-Path (Join-Path $payloadDir $name))) {
                $allReady = $false
              }
            }
          }

          if (-not $allReady) {
            Write-Host "Season asset payload set is incomplete; keeping repository assets as-is."
            exit 0
          }

          $target = Join-Path $env:GITHUB_WORKSPACE "picture\theme\season backgrounds"
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          Get-ChildItem $target -File |
            Where-Object { $_.Name -match '^(Spring|Summer|Autumn|Winter)_.+\.(svg|png|jpg|jpeg|webp)$' } |
            Remove-Item -Force

          foreach ($season in @("spring", "summer", "autumn", "winter")) {
            $payload = Join-Path $payloadDir "$season.b64"
            $zip = Join-Path $env:RUNNER_TEMP "$season.zip"

            [IO.File]::WriteAllBytes(
              $zip,
              [Convert]::FromBase64String((Get-Content $payload -Raw).Trim())
            )

            Expand-Archive -Path $zip -DestinationPath $target -Force
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build WinUI desktop app
        run: dotnet build src/BDFR.PersianCalendar.Desktop/BDFR.PersianCalendar.Desktop.csproj -c Release -p:Platform=x64

      - name: Publish Windows x64 test build
        shell: pwsh
        run: |
          dotnet publish src/BDFR.PersianCalendar.Desktop/BDFR.PersianCalendar.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=false `
            -o artifacts/BDFR_PersianCalendar-win-x64

      - name: Package portable test ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/BDFR_PersianCalendar-win-x64/* `
            -DestinationPath artifacts/BDFR_PersianCalendar-win-x64.zip `
            -Force

          (Get-FileHash artifacts/BDFR_PersianCalendar-win-x64.zip -Algorithm SHA256).Hash |
            Out-File artifacts/BDFR_PersianCalendar-win-x64.zip.sha256 -Encoding ascii

      - name: Install Inno Setup
        if: github.event_name == 'push'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMySourceDir="${{ github.workspace }}\artifacts\BDFR_PersianCalendar-win-x64" `
            /DMyOutputDir="${{ github.workspace }}\artifacts" `
            installer\BDFR_PersianCalendar.iss

          (Get-FileHash artifacts/BDFR_PersianCalendar-Setup-x64.exe -Algorithm SHA256).Hash |
            Out-File artifacts/BDFR_PersianCalendar-Setup-x64.exe.sha256 -Encoding ascii

      - name: Upload portable test artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDFR_PersianCalendar-win-x64
          path: |
            artifacts/BDFR_PersianCalendar-win-x64.zip
            artifacts/BDFR_PersianCalendar-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: BDFR_PersianCalendar-Setup-x64
          path: |
            artifacts/BDFR_PersianCalendar-Setup-x64.exe
            artifacts/BDFR_PersianCalendar-Setup-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub test pre-release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "test-${{ github.run_number }}"
          $title = "BDFR Persian Calendar Test Build #${{ github.run_number }}"
          $releaseTarget = (git rev-parse HEAD).Trim()
          $notes = "Automated Windows x64 test build from main. Commit: $releaseTarget. Includes portable ZIP, installer EXE and SHA256 checksums."

          gh release create $tag `
            artifacts/BDFR_PersianCalendar-win-x64.zip `
            artifacts/BDFR_PersianCalendar-win-x64.zip.sha256 `
            artifacts/BDFR_PersianCalendar-Setup-x64.exe `
            artifacts/BDFR_PersianCalendar-Setup-x64.exe.sha256 `
            --repo "${{ github.repository }}" `
            --target $releaseTarget `
            --title $title `
            --notes $notes `
            --prerelease
