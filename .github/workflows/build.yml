name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

concurrency:
  group: bdfr-persian-calendar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run calendar and time.ir parser smoke checks
        run: dotnet run --project tools/BDFR.PersianCalendar.Smoke/BDFR.PersianCalendar.Smoke.csproj

      - name: Build infrastructure
        run: dotnet build src/BDFR.PersianCalendar.Infrastructure/BDFR.PersianCalendar.Infrastructure.csproj -c Release


  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android debug app
        run: gradle -p mobile/android :app:assembleDebug --stacktrace

      - name: Upload Android debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Zurvan-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iOS Xcode project
        working-directory: mobile/ios
        run: xcodegen generate

      - name: Build iOS simulator app
        run: |
          xcodebuild             -project mobile/ios/ZurvanIOS.xcodeproj             -scheme ZurvanIOS             -sdk iphonesimulator             -configuration Debug             CODE_SIGNING_ALLOWED=NO             build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize optional seasonal carousel assets
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $payloadDir = Join-Path $env:GITHUB_WORKSPACE "tools\season-assets"
          $required = @("spring.b64", "summer.b64", "autumn.b64", "winter.b64")
          $allReady = Test-Path $payloadDir

          if ($allReady) {
            foreach ($name in $required) {
              if (-not (Test-Path (Join-Path $payloadDir $name))) {
                $allReady = $false
              }
            }
          }

          if (-not $allReady) {
            Write-Host "Season asset payload set is incomplete; keeping repository assets as-is."
            exit 0
          }

          $target = Join-Path $env:GITHUB_WORKSPACE "picture\theme\season backgrounds"
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          # Remove only old aspect-ratio variants. Keep numbered carousel
          # files such as Spring_1.jpg / Spring_2.webp.
          Get-ChildItem $target -File |
            Where-Object { $_.Name -match '^(Spring|Summer|Autumn|Winter)[_-]\d{1,3}x\d{1,3}\.(svg|png|jpg|jpeg|webp)$' } |
            Remove-Item -Force

          foreach ($season in @("spring", "summer", "autumn", "winter")) {
            $payload = Join-Path $payloadDir "$season.b64"
            $zip = Join-Path $env:RUNNER_TEMP "$season.zip"

            [IO.File]::WriteAllBytes(
              $zip,
              [Convert]::FromBase64String((Get-Content $payload -Raw).Trim())
            )

            Expand-Archive -Path $zip -DestinationPath $target -Force
          }

          # Older optional payload bundles may still carry aspect-ratio files.
          Get-ChildItem $target -File |
            Where-Object { $_.Name -match '^(Spring|Summer|Autumn|Winter)[_-]\d{1,3}x\d{1,3}\.(svg|png|jpg|jpeg|webp)$' } |
            Remove-Item -Force

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build WinUI desktop app
        run: dotnet build src/BDFR.PersianCalendar.Desktop/BDFR.PersianCalendar.Desktop.csproj -c Release -p:Platform=x64 -p:AnahitaGitCommit="${{ github.sha }}" -p:AnahitaBuildNumber="${{ github.run_number }}"

      - name: Publish Windows x64 test build
        shell: pwsh
        run: |
          dotnet publish src/BDFR.PersianCalendar.Desktop/BDFR.PersianCalendar.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=false `
            -p:AnahitaGitCommit="${{ github.sha }}" `
            -p:AnahitaBuildNumber="${{ github.run_number }}" `
            -o artifacts/Zurvan-win-x64

      - name: Package portable test ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/Zurvan-win-x64/* `
            -DestinationPath artifacts/Zurvan-win-x64.zip `
            -Force

          (Get-FileHash artifacts/Zurvan-win-x64.zip -Algorithm SHA256).Hash |
            Out-File artifacts/Zurvan-win-x64.zip.sha256 -Encoding ascii

      - name: Package lightweight debug patch
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $publish = Join-Path $env:GITHUB_WORKSPACE "artifacts\Zurvan-win-x64"
          $patch = Join-Path $env:GITHUB_WORKSPACE "artifacts\Zurvan-DebugPatch-x64"
          New-Item -ItemType Directory -Force -Path $patch | Out-Null

          # First-party binaries carry the code we are changing during the
          # stability/debug cycle. Keep the self-contained .NET/WinUI runtime
          # in the user's existing full portable folder instead of shipping it
          # again for every tiny code change.
          $patterns = @(
            "BDFR.PersianCalendar.Desktop.exe",
            "BDFR.PersianCalendar.Desktop.dll",
            "BDFR.PersianCalendar.Desktop.pdb",
            "BDFR.PersianCalendar.Desktop.deps.json",
            "BDFR.PersianCalendar.Desktop.runtimeconfig.json",
            "BDFR.PersianCalendar.Core.dll",
            "BDFR.PersianCalendar.Core.pdb",
            "BDFR.PersianCalendar.Infrastructure.dll",
            "BDFR.PersianCalendar.Infrastructure.pdb",
            "*.pri"
          )

          foreach ($pattern in $patterns) {
            Get-ChildItem -Path $publish -Filter $pattern -File -ErrorAction SilentlyContinue |
              Copy-Item -Destination $patch -Force
          }

          # Include Season Carousel assets in the lightweight patch too.
          $seasonSource = Join-Path $publish "picture\theme\season backgrounds"
          $seasonPatch = Join-Path $patch "picture\theme\season backgrounds"
          if (Test-Path $seasonSource) {
            New-Item -ItemType Directory -Force -Path $seasonPatch | Out-Null
            Copy-Item -Path "$seasonSource\*" -Destination $seasonPatch -Force
          }

          # Include editable occasion-picture mappings and their assets.
          $occasionSource = Join-Path $publish "picture\occasion"
          $occasionPatch = Join-Path $patch "picture\occasion"
          if (Test-Path $occasionSource) {
            New-Item -ItemType Directory -Force -Path $occasionPatch | Out-Null
            Copy-Item -Path "$occasionSource\*" -Destination $occasionPatch -Recurse -Force
          }

          @"
          Zurvan lightweight debug patch
          ===============================
          Base requirement:
          - Keep one recent full Zurvan portable build already extracted.
          - Close Zurvan completely.
          - Extract this ZIP directly over that existing folder and replace files.
          - Do NOT delete the existing .NET / Windows App SDK runtime files.

          This patch is intended for rapid debug builds where package/runtime
          dependencies did not change. If a future release changes NuGet/runtime
          dependencies, use that release's full portable ZIP once, then continue
          with lightweight patches again.
          "@ | Out-File (Join-Path $patch "PATCH-README.txt") -Encoding utf8

          Compress-Archive `
            -Path "$patch\*" `
            -DestinationPath artifacts/Zurvan-DebugPatch-x64.zip `
            -Force

          (Get-FileHash artifacts/Zurvan-DebugPatch-x64.zip -Algorithm SHA256).Hash |
            Out-File artifacts/Zurvan-DebugPatch-x64.zip.sha256 -Encoding ascii

          $fullSize = (Get-Item artifacts/Zurvan-win-x64.zip).Length
          $patchSize = (Get-Item artifacts/Zurvan-DebugPatch-x64.zip).Length
          Write-Host ("Full portable: {0:N2} MB" -f ($fullSize / 1MB))
          Write-Host ("Debug patch:   {0:N2} MB" -f ($patchSize / 1MB))

      - name: Install Inno Setup
        if: github.event_name == 'push'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMySourceDir="${{ github.workspace }}\artifacts\Zurvan-win-x64" `
            /DMyOutputDir="${{ github.workspace }}\artifacts" `
            installer\BDFR_PersianCalendar.iss

          (Get-FileHash artifacts/Zurvan-Setup-x64.exe -Algorithm SHA256).Hash |
            Out-File artifacts/Zurvan-Setup-x64.exe.sha256 -Encoding ascii

      - name: Upload portable test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zurvan-win-x64
          path: |
            artifacts/Zurvan-win-x64.zip
            artifacts/Zurvan-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload lightweight debug patch artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Zurvan-DebugPatch-x64
          path: |
            artifacts/Zurvan-DebugPatch-x64.zip
            artifacts/Zurvan-DebugPatch-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Zurvan-Setup-x64
          path: |
            artifacts/Zurvan-Setup-x64.exe
            artifacts/Zurvan-Setup-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub test pre-release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "test-${{ github.run_number }}"
          $title = "Zurvan Test Build #${{ github.run_number }}"
          $releaseTarget = (git rev-parse HEAD).Trim()
          $notes = "Automated Zurvan Windows x64 test build from main. Commit: $releaseTarget. Includes portable ZIP, installer EXE and SHA256 checksums."

          gh release create $tag `
            artifacts/Zurvan-win-x64.zip `
            artifacts/Zurvan-win-x64.zip.sha256 `
            artifacts/Zurvan-DebugPatch-x64.zip `
            artifacts/Zurvan-DebugPatch-x64.zip.sha256 `
            artifacts/Zurvan-Setup-x64.exe `
            artifacts/Zurvan-Setup-x64.exe.sha256 `
            --repo "${{ github.repository }}" `
            --target $releaseTarget `
            --title $title `
            --notes $notes `
            --prerelease
