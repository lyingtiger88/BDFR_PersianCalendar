name: Zurvan Android signed upgrade APK

on:
  workflow_dispatch:
  # Validate the release-signing pipeline whenever its guarded workflow changes.
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-signed-release.yml"
      - "mobile/android/app/build.gradle.kts"

permissions:
  contents: read

jobs:
  signed-release:
    name: Signed Android release (same certificate across updates)
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ZURVAN_ANDROID_KEYSTORE_B64 }}
      STORE_PASSWORD: ${{ secrets.ZURVAN_ANDROID_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ZURVAN_ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ZURVAN_ANDROID_KEY_PASSWORD }}
      PUBLIC_LICENSE_KEY: ${{ vars.ZURVAN_LICENSE_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify signing secrets and reconstruct keystore
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PUBLIC_LICENSE_KEY:-}" ]]; then echo "::error::Missing ZURVAN_LICENSE_PUBLIC_KEY_B64 repository variable."; exit 1; fi
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing secret: ${name}. Signed release refused."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          chmod 600 "$RUNNER_TEMP/android-release.jks"
          echo "ZURVAN_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-release.jks" >> "$GITHUB_ENV"
          echo "ZURVAN_ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ZURVAN_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ZURVAN_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Validate signing certificate before build
        shell: bash
        env:
          EXPECTED_SHA256: 29434EDEB1227348B4DA7FB8F1CDA4D607E433A800DB8E498E3978426860FBE8
        run: |
          set -euo pipefail
          ACTUAL="$(keytool -list -v -keystore "$RUNNER_TEMP/android-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d '[:space:]:')"
          test "${ACTUAL^^}" = "$EXPECTED_SHA256" || { echo "::error::Wrong Android signing certificate. DO NOT publish this APK as an update."; exit 1; }
          echo "Verified stable Android release certificate SHA-256: $EXPECTED_SHA256"
      - name: Assemble signed release APK
        shell: bash
        run: |
          set -euo pipefail
          # A run_number-based versionCode prevents same-code updates being rejected.
          gradle -p mobile/android --no-daemon :app:assembleRelease "-PZURVAN_VERSION_CODE=$((10000 + ${{ github.run_number }}))" "-PZURVAN_LICENSE_PUBLIC_KEY_B64=$PUBLIC_LICENSE_KEY"
          test -s "mobile/android/app/build/outputs/apk/release/app-release.apk"
      - name: Verify the final APK signature and identity
        shell: bash
        env:
          EXPECTED_SHA256: 29434EDEB1227348B4DA7FB8F1CDA4D607E433A800DB8E498E3978426860FBE8
        run: |
          set -euo pipefail
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          ACTUAL="$("$SDK_BUILD_TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]:')"
          test "${ACTUAL^^}" = "$EXPECTED_SHA256" || { echo "::error::APK signing certificate does not match stable release key."; exit 1; }
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" | head -n 2
          sha256sum "$APK"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Zurvan-Android-Release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 60
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/android-release.jks"
