name: Validate Zodiac Assets (no generation, no build)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zodiac-asset-validation
  cancel-in-progress: false

jobs:
  validate-zodiac-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository zodiac PNGs without modifying them
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('picture/zodiac/png')
          assert root.is_dir(), f'Missing source directory: {root}'
          files = [p for p in root.iterdir() if p.is_file()]
          assert len(files) == 108, f'Expected 108 zodiac PNGs in repository, found {len(files)}'
          names = ('aries','taurus','gemini','cancer','leo','virgo','libra','scorpio','sagittarius','capricorn','aquarius','pisces')
          styles = ('cosmic','cute_1','cute_2','cute_3','luxury','minimal','mythic','neon','watercolor')
          for style in styles:
              for name in names:
                  path = root / f'{style}_{name}.png'
                  assert path.is_file(), f'Missing approved PNG filename: {path}'
                  with Image.open(path) as image:
                      assert image.format == 'PNG', f'Invalid PNG: {path}'
                      image.verify()
          print('Verified 108 PNG files. No regeneration, write or build.')
          PY
