name: Validate Zodiac Assets (no generation, no build)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zodiac-asset-validation
  cancel-in-progress: false

jobs:
  validate-zodiac-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate approved artwork set without modifying files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("picture/zodiac/png")
          assert root.is_dir(), f"Missing asset directory: {root}"
          files = [p for p in root.iterdir() if p.is_file()]
          assert len(files) == 143, (
              f"Expected 143 approved zodiac assets, found {len(files)}. "
              "Restore the complete manually approved asset set before release."
          )
          pngs = [p for p in files if p.suffix.lower() == ".png"]
          svgs = [p for p in files if p.suffix.lower() == ".svg"]
          icos = [p for p in files if p.suffix.lower() == ".ico"]
          assert pngs and svgs and ic os, "Expected PNG, SVG and ICO artwork in the approved set."
          for path in pngs:
              with Image.open(path) as image:
                  assert image.format == "PNG", f"Invalid PNG: {path}"
                  image.verify()
          print(f"Validated {len(files)} assets: {len(pngs)} PNG, {len(svgs)} SVG, {len(ic os)} ICO.")
          print("No artwork was generated, replaced, committed or built.")
          PY
