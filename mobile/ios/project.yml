name: ZurvanIOS
options:
  bundleIdPrefix: com.bdfr
  deploymentTarget:
    iOS: "17.0"
targets:
  ZurvanIOS:
    type: application
    platform: iOS
    sources:
      - ZurvanIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bdfr.zurvan
        PRODUCT_NAME: Zurvan
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: ZurvanIOS/Info.plist
      properties:
        CFBundleDisplayName: "Zurvan | زروان"
        UILaunchScreen: {}
